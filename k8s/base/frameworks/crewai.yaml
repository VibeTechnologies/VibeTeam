# CrewAI Framework Deployment
# Runs CrewAI-based agents in isolated environment
# NOTE: Disabled for now (known broken). Replicas set to 0.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-agents
  labels:
    app: crewai-agents
    framework: crewai
    team: vibeteam
spec:
  replicas: 0
  selector:
    matchLabels:
      app: crewai-agents
  template:
    metadata:
      labels:
        app: crewai-agents
        framework: crewai
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: crewai
          image: ghcr.io/vibetechnologies/vibeteam-crewai:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_BASE
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_VERSION
            - name: AZURE_ALLOW_RESPONSES_MODELS
              value: "true"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crewai-agents
  labels:
    app: crewai-agents
    framework: crewai
spec:
  selector:
    app: crewai-agents
  ports:
    - port: 80
      targetPort: 8080
      name: http
