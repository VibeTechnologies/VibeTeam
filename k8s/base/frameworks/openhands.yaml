# OpenHands Framework Deployment
# Runs OpenHands-based agents in isolated environment
# Note: OpenHands requires pydantic>=2.11.3 which conflicts with other frameworks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-agents
  labels:
    app: openhands-agents
    framework: openhands
    team: vibeteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openhands-agents
  template:
    metadata:
      labels:
        app: openhands-agents
        framework: openhands
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: openhands
          image: ghcr.io/vibetechnologies/vibeteam-openhands:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: github-app-role-secrets
          env:
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_BASE
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_VERSION
            - name: AZURE_ALLOW_RESPONSES_MODELS
              value: "true"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          # Note: Docker socket mounting removed - K3s uses containerd
          # OpenHands sandboxing may need alternative configuration
---
apiVersion: v1
kind: Service
metadata:
  name: openhands-agents
  labels:
    app: openhands-agents
    framework: openhands
spec:
  selector:
    app: openhands-agents
  ports:
    - port: 80
      targetPort: 8080
      name: http
