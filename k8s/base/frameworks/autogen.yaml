# AutoGen Framework Deployment
# Runs AutoGen-based agents in isolated environment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autogen-agents
  labels:
    app: autogen-agents
    framework: autogen
    team: vibeteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autogen-agents
  template:
    metadata:
      labels:
        app: autogen-agents
        framework: autogen
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: autogen
          image: ghcr.io/vibetechnologies/vibeteam-autogen:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_BASE
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_VERSION
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: autogen-agents
  labels:
    app: autogen-agents
    framework: autogen
spec:
  selector:
    app: autogen-agents
  ports:
    - port: 80
      targetPort: 8080
      name: http
