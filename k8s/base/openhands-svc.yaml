# OpenHands Agent Service Deployment
# Long-running FastAPI server for OpenHands agents
# Note: OpenHands requires pydantic>=2.11.3 (isolated from other frameworks)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-svc
  labels:
    app: openhands-svc
    team: vibeteam
    component: agent-service
    framework: openhands
spec:
  replicas: 1
  # Recreate strategy: single-node cluster cannot run two openhands pods simultaneously
  # (each requires 3-6Gi memory). RollingUpdate causes deadlock since the new pod
  # can't schedule until the old one terminates, but the old won't terminate until
  # the new one is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openhands-svc
  template:
    metadata:
      labels:
        app: openhands-svc
        team: vibeteam
        component: agent-service
        framework: openhands
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: kubeconfig-init
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /kube
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              cat <<EOF > /kube/config
              apiVersion: v1
              kind: Config
              clusters:
              - name: in-cluster
                cluster:
                  server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              users:
              - name: vibeteam-agent
                user:
                  token: ${TOKEN}
              contexts:
              - name: vibeteam
                context:
                  cluster: in-cluster
                  user: vibeteam-agent
                  namespace: vibeteam
              current-context: vibeteam
              EOF
          volumeMounts:
            - name: kubeconfig
              mountPath: /kube
        - name: agents-sync
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -f /app/agents/agents.yaml ]; then
                echo "Agents config already present."
                exit 0
              fi
              mkdir -p /app/agents
              if mkdir /app/agents/.init-lock 2>/dev/null; then
                git clone --depth 1 --branch "${AGENTS_REPO_REF}" "${AGENTS_REPO_URL}" /tmp/repo
                cp -R /tmp/repo/agents/. /app/agents/
                rm -rf /tmp/repo
                rmdir /app/agents/.init-lock
              else
                echo "Waiting for agents config to be populated..."
                until [ -f /app/agents/agents.yaml ]; do sleep 2; done
              fi
          env:
            - name: AGENTS_REPO_URL
              value: "https://github.com/VibeTechnologies/VibeTeam.git"
            - name: AGENTS_REPO_REF
              value: "master"
          volumeMounts:
            - name: agents-config
              mountPath: /app/agents
      containers:
        - name: openhands
          image: ghcr.io/vibetechnologies/vibeteam-openhands:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: github-app-role-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_BASE
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_OPENAI_DEPLOYMENT
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_VERSION
            - name: AZURE_ALLOW_RESPONSES_MODELS
              value: "true"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_AUTH_TOKEN
            - name: GMAIL_CREDENTIALS_PATH
              value: "/gmail/gmail-credentials.json"
            - name: GMAIL_TOKEN_PATH
              value: "/gmail/gmail-token.json"
            - name: CHROME_DEVTOOLS_BROWSER_URL
              value: "http://browserless:3000"
            - name: OPENHANDS_SYNC_IDLE_TIMEOUT_SECONDS
              value: "300"
            - name: RUNTIME
              value: "process"
            - name: KUBECONFIG
              value: /kube/config
            - name: VIBETEAM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENTS_DIR
              value: "/app/agents"
            - name: AGENTS_CONFIG_PATH
              value: "/app/agents/agents.yaml"
          volumeMounts:
            - name: gmail-oauth
              mountPath: /gmail
            - name: agents-config
              mountPath: /app/agents
            - name: kubeconfig
              mountPath: /kube
          resources:
            requests:
              memory: "3Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: gmail-oauth
          secret:
            secretName: gmail-oauth-secret
        - name: kubeconfig
          emptyDir: {}
        - name: agents-config
          persistentVolumeClaim:
            claimName: agents-config
---
apiVersion: v1
kind: Service
metadata:
  name: openhands-svc
  labels:
    app: openhands-svc
    team: vibeteam
    framework: openhands
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: openhands-svc
