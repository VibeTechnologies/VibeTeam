# OpenHands Agent Service Deployment
# Long-running FastAPI server for OpenHands agents
# Note: OpenHands requires pydantic>=2.11.3 (isolated from other frameworks)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-svc
  labels:
    app: openhands-svc
    team: vibeteam
    component: agent-service
    framework: openhands
spec:
  replicas: 1
  # Recreate strategy: single-node cluster cannot run two openhands pods simultaneously
  # (each requires 3-6Gi memory). RollingUpdate causes deadlock since the new pod
  # can't schedule until the old one terminates, but the old won't terminate until
  # the new one is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openhands-svc
  template:
    metadata:
      labels:
        app: openhands-svc
        team: vibeteam
        component: agent-service
        framework: openhands
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: openhands
          image: ghcr.io/vibetechnologies/vibeteam-openhands:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_BASE
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_OPENAI_DEPLOYMENT
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_VERSION
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_AUTH_TOKEN
          resources:
            requests:
              memory: "3Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: openhands-svc
  labels:
    app: openhands-svc
    team: vibeteam
    framework: openhands
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: openhands-svc
