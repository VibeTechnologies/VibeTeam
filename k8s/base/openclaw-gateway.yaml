apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-gateway
  labels:
    app: openclaw-gateway
    team: vibeteam
    component: openclaw-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-gateway
  template:
    metadata:
      labels:
        app: openclaw-gateway
        team: vibeteam
        component: openclaw-gateway
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: init-openclaw-dirs
          image: ghcr.io/openclaw/openclaw:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /home/node/.openclaw/agents/product-manager/agent
              mkdir -p /home/node/.openclaw/agents/marketing-manager/agent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-state
              mountPath: /home/node/.openclaw
        - name: agents-sync
          image: alpine/git:2.45.2
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              if [ -f /app/agents/agents.yaml ]; then
                echo "Agents config already present."
                exit 0
              fi
              mkdir -p /app/agents
              if mkdir /app/agents/.init-lock 2>/dev/null; then
                git clone --depth 1 --branch "${AGENTS_REPO_REF}" "${AGENTS_REPO_URL}" /tmp/repo
                cp -R /tmp/repo/agents/. /app/agents/
                rm -rf /tmp/repo
                rmdir /app/agents/.init-lock
              else
                echo "Waiting for agents config to be populated..."
                until [ -f /app/agents/agents.yaml ]; do sleep 2; done
              fi
          env:
            - name: AGENTS_REPO_URL
              value: "https://github.com/VibeTechnologies/VibeTeam.git"
            - name: AGENTS_REPO_REF
              value: "master"
          volumeMounts:
            - name: agents-config
              mountPath: /app/agents
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - node
            - openclaw.mjs
            - gateway
            - --bind
            - lan
            - --port
            - "18789"
          workingDir: /app
          ports:
            - containerPort: 18789
              name: gateway
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secret
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: true
            - name: LITELLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: LITELLM_BASE_URL
                  optional: true
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: LITELLM_API_KEY
                  optional: true
          volumeMounts:
            - name: openclaw-state
              mountPath: /home/node/.openclaw
            - name: openclaw-config
              mountPath: /home/node/.openclaw/openclaw.json
              subPath: openclaw.json
            - name: agents-config
              mountPath: /home/node/.openclaw/agents/product-manager/agent/AGENTS.md
              subPath: ProductManager/AGENTS.md
            - name: agents-config
              mountPath: /home/node/.openclaw/agents/marketing-manager/agent/AGENTS.md
              subPath: MarketingManager/AGENTS.md
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 18789
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: openclaw-state
          emptyDir: {}
        - name: openclaw-config
          configMap:
            name: openclaw-config
        - name: agents-config
          persistentVolumeClaim:
            claimName: agents-config
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
  labels:
    app: openclaw-gateway
    team: vibeteam
spec:
  selector:
    app: openclaw-gateway
  ports:
    - protocol: TCP
      port: 18789
      targetPort: 18789
      name: gateway
  type: ClusterIP
