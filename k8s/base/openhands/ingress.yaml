# OpenHands Ingress
# Exposes OpenHands Web UI at team.vibebrowser.app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhands
  labels:
    app: openhands
    team: vibeteam
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - team.vibebrowser.app
      secretName: openhands-tls
  rules:
    - host: team.vibebrowser.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhands
                port:
                  number: 3000
