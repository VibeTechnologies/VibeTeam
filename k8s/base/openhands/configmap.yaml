# OpenHands ConfigMap
# Configuration for the OpenHands server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openhands-config
  labels:
    app: openhands
    team: vibeteam
data:
  config.toml: |
    [core]
    workspace_base = "/opt/workspace"
    max_iterations = 100
    
    [llm]
    model = "azure/gpt-4.1"
    api_version = "2024-08-01-preview"
    temperature = 0.0
    max_output_tokens = 4096
    
    [sandbox]
    timeout = 300
