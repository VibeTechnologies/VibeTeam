# OpenHands Service
# Exposes the OpenHands server within the cluster
---
apiVersion: v1
kind: Service
metadata:
  name: openhands
  labels:
    app: openhands
    team: vibeteam
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: openhands
