# Slack Agents Kustomization
# Deploys all agent types as independent Slack polling pods
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - support-agent.yaml
  - swe-agent.yaml
  - release-agent.yaml
  - pm-agent.yaml

commonLabels:
  team: vibeteam
  component: slack-agent
