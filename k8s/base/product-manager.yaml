---
# Product Manager CronJob - Langfuse Conversation Analysis
#
# Analyzes:
# - Docs support chat conversations from Langfuse
# - Extracts feature requests from user conversations
# - Creates GitHub issues for validated requests
# - Updates the Customer Requests tracking table
#
# Schedule: Every 2 hours
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-manager-scripts
data:
  analyze_conversations.py: |
    #!/usr/bin/env python3
    """Product Manager Agent - Langfuse Conversation Analysis for Feature Requests."""
    
    import json
    import logging
    import os
    import subprocess
    import sys
    from dataclasses import dataclass
    from datetime import datetime, timedelta
    from pathlib import Path
    from typing import Optional
    
    import requests
    import sentry_sdk
    
    # Initialize Sentry for VibeTeam monitoring
    SENTRY_DSN = os.environ.get(
        "VIBETEAM_SENTRY_DSN",
        "https://94ea47941d3f92fea1a886094ab9708d@o4510132673511424.ingest.us.sentry.io/4510761220308992"
    )
    sentry_sdk.init(dsn=SENTRY_DSN, environment="production", traces_sample_rate=0.1)
    
    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [%(levelname)s] %(message)s",
    )
    logger = logging.getLogger(__name__)
    
    # Configuration
    GITHUB_REPO = "VibeTechnologies/VibeWebAgent"
    CUSTOMER_REQUESTS_ISSUE = 322
    
    # Feature request detection patterns
    FEATURE_REQUEST_PATTERNS = [
        "can you add",
        "would be nice if",
        "feature request",
        "i wish",
        "it would be great",
        "please add",
        "need a way to",
        "missing feature",
        "suggestion:",
        "i'd like to",
        "any plans to",
        "does vibe support",
        "can vibe do",
        "integrate with",
        "integration for",
    ]
    
    # Ignore patterns (support questions, not feature requests)
    IGNORE_PATTERNS = [
        "how do i",
        "how to",
        "not working",
        "error",
        "bug",
        "broken",
        "help me",
        "what is",
        "explain",
    ]
    
    
    @dataclass
    class Conversation:
        """Represents a Langfuse conversation/trace."""
        id: str
        name: str
        user_id: Optional[str]
        session_id: Optional[str]
        input_text: str
        output_text: str
        timestamp: str
        metadata: dict
    
    
    @dataclass
    class FeatureRequest:
        """Extracted feature request."""
        source_trace_id: str
        request_text: str
        context: str
        priority: str
        analysis: str
        timestamp: str
    
    
    class ProductManagerAgent:
        """Product Manager agent for analyzing Langfuse conversations."""
    
        def __init__(self):
            self.langfuse_public = os.environ.get("LANGFUSE_PUBLIC_KEY")
            self.langfuse_secret = os.environ.get("LANGFUSE_SECRET_KEY")
            self.langfuse_url = os.environ.get("LANGFUSE_BASE_URL", "https://langfuse.vibebrowser.app")
            self.gh_token = os.environ.get("GITHUB_TOKEN")
            self.azure_api_key = os.environ.get("AZURE_API_KEY")
            self.azure_api_base = os.environ.get("AZURE_API_BASE", "https://info-mjnxtt51-eastus2.cognitiveservices.azure.com/")
            
            self.state_file = Path("/tmp/product-manager-state.json")
            self.state = self._load_state()
    
        def _load_state(self) -> dict:
            if self.state_file.exists():
                with open(self.state_file) as f:
                    return json.load(f)
            return {"processed_traces": [], "last_run": None}
    
        def _save_state(self):
            self.state["last_run"] = datetime.utcnow().isoformat()
            # Keep only last 500 processed IDs
            self.state["processed_traces"] = self.state["processed_traces"][-500:]
            with open(self.state_file, "w") as f:
                json.dump(self.state, f)
    
        def fetch_conversations(self, hours: int = 2) -> list:
            """Fetch support chat conversations from Langfuse."""
            if not self.langfuse_public or not self.langfuse_secret:
                logger.warning("Langfuse credentials not set")
                return []
    
            url = self.langfuse_url + "/api/public/traces"
            from_time = datetime.utcnow() - timedelta(hours=hours)
            params = {
                "limit": 100,
                "orderBy": "timestamp.desc",
                "fromTimestamp": from_time.isoformat() + "Z",
                "name": "support-chat",
            }
    
            try:
                resp = requests.get(
                    url,
                    auth=(self.langfuse_public, self.langfuse_secret),
                    params=params,
                    timeout=30
                )
                resp.raise_for_status()
                traces = resp.json().get("data", [])
                
                conversations = []
                for trace in traces:
                    input_text = trace.get("input", "") or ""
                    output_text = trace.get("output", "") or ""
                    
                    if isinstance(input_text, dict):
                        input_text = input_text.get("message", "") or input_text.get("query", "") or str(input_text)
                    if isinstance(output_text, dict):
                        output_text = output_text.get("response", "") or output_text.get("answer", "") or str(output_text)
                    
                    conversations.append(Conversation(
                        id=trace.get("id", ""),
                        name=trace.get("name", ""),
                        user_id=trace.get("userId"),
                        session_id=trace.get("sessionId"),
                        input_text=str(input_text)[:2000],
                        output_text=str(output_text)[:2000],
                        timestamp=trace.get("timestamp", ""),
                        metadata=trace.get("metadata", {}) or {},
                    ))
                
                return conversations
            except Exception as e:
                logger.error("Error fetching Langfuse conversations: %s", e)
                return []
    
        def is_feature_request(self, text: str) -> bool:
            """Check if text contains a feature request."""
            text_lower = text.lower()
            
            for pattern in IGNORE_PATTERNS:
                if pattern in text_lower:
                    return False
            
            for pattern in FEATURE_REQUEST_PATTERNS:
                if pattern in text_lower:
                    return True
            
            return False
    
        def analyze_conversation(self, conversation: Conversation) -> Optional[FeatureRequest]:
            """Analyze conversation for feature requests using pattern matching."""
            if self.is_feature_request(conversation.input_text):
                return FeatureRequest(
                    source_trace_id=conversation.id,
                    request_text=conversation.input_text[:50],
                    context=conversation.input_text[:200],
                    priority="P2",
                    analysis="Pattern-matched feature request from support chat",
                    timestamp=conversation.timestamp,
                )
            return None
    
        def update_github_tracking(self, request: FeatureRequest) -> Optional[str]:
            """Add feature request to GitHub tracking issue."""
            if not self.gh_token:
                logger.warning("GITHUB_TOKEN not set")
                return None
    
            try:
                headers = {
                    "Authorization": "Bearer " + self.gh_token,
                    "Accept": "application/vnd.github+json",
                }
                
                issue_url = "https://api.github.com/repos/" + GITHUB_REPO + "/issues/" + str(CUSTOMER_REQUESTS_ISSUE)
                resp = requests.get(issue_url, headers=headers, timeout=10)
                resp.raise_for_status()
                issue = resp.json()
                body = issue.get("body", "")
                
                date = datetime.utcnow().strftime("%Y-%m-%d")
                new_row = "| " + date + " | langfuse | " + request.request_text + " | " + request.priority + " | Analyzing | " + request.analysis[:80] + " |"
                
                lines = body.split("\n")
                new_lines = []
                inserted = False
                
                for line in lines:
                    new_lines.append(line)
                    if line.strip().startswith("|---") and not inserted:
                        new_lines.append(new_row)
                        inserted = True
                
                if not inserted:
                    new_lines.append(new_row)
                
                new_body = "\n".join(new_lines)
                
                resp = requests.patch(
                    issue_url,
                    headers=headers,
                    json={"body": new_body},
                    timeout=10
                )
                resp.raise_for_status()
                
                logger.info("Updated GitHub issue #%d", CUSTOMER_REQUESTS_ISSUE)
                return issue.get("html_url")
                
            except Exception as e:
                logger.error("Failed to update GitHub: %s", e)
                return None
    
        def create_github_issue_for_request(self, request: FeatureRequest) -> Optional[str]:
            """Create a new GitHub issue for high-priority feature requests."""
            if not self.gh_token:
                return None
            
            if request.priority not in ["P0", "P1"]:
                return None
    
            title = "[Feature Request] " + request.request_text
            body = """## Feature Request

    **Source:** Langfuse support chat
    **Priority:** """ + request.priority + """
    **Date:** """ + (request.timestamp[:10] if request.timestamp else datetime.utcnow().strftime('%Y-%m-%d')) + """

    ## Request
    """ + request.context + """

    ## Analysis
    """ + request.analysis + """

    ## Trace ID
    `""" + request.source_trace_id + """`

    ---
    *Auto-created by Product Manager Agent*
    """
            
            cmd = [
                "gh", "issue", "create",
                "--repo", GITHUB_REPO,
                "--title", title,
                "--body", body,
                "--label", "enhancement,feature-request"
            ]
            
            result = subprocess.run(
                cmd, capture_output=True, text=True,
                env=dict(os.environ, GH_TOKEN=self.gh_token)
            )
            
            if result.returncode == 0:
                url = result.stdout.strip()
                logger.info("Created GitHub issue: %s", url)
                return url
            else:
                logger.error("Failed to create issue: %s", result.stderr)
                return None
    
        def run(self) -> dict:
            """Run the conversation analysis."""
            logger.info("=" * 60)
            logger.info("Product Manager Agent - Langfuse Conversation Analysis")
            logger.info("=" * 60)
    
            stats = {
                "conversations_analyzed": 0,
                "feature_requests_found": 0,
                "github_updated": 0,
                "issues_created": [],
            }
    
            try:
                conversations = self.fetch_conversations(hours=2)
                logger.info("Found %d conversations to analyze", len(conversations))
    
                for conv in conversations:
                    if conv.id in self.state["processed_traces"]:
                        continue
    
                    stats["conversations_analyzed"] += 1
                    
                    request = self.analyze_conversation(conv)
                    
                    if request:
                        stats["feature_requests_found"] += 1
                        logger.info("Found feature request: %s", request.request_text)
                        
                        if self.update_github_tracking(request):
                            stats["github_updated"] += 1
                        
                        issue_url = self.create_github_issue_for_request(request)
                        if issue_url:
                            stats["issues_created"].append(issue_url)
                    
                    self.state["processed_traces"].append(conv.id)
    
                logger.info("=" * 60)
                logger.info("SUMMARY")
                logger.info("  Conversations analyzed: %d", stats["conversations_analyzed"])
                logger.info("  Feature requests found: %d", stats["feature_requests_found"])
                logger.info("  GitHub tracking updated: %d", stats["github_updated"])
                logger.info("  Issues created: %d", len(stats["issues_created"]))
                logger.info("=" * 60)
    
                self._save_state()
                return stats
    
            except Exception as e:
                logger.exception("Agent failed: %s", e)
                sentry_sdk.capture_exception(e)
                return stats


    if __name__ == "__main__":
        agent = ProductManagerAgent()
        agent.run()

---
# Product Manager CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: product-manager
  labels:
    app: product-manager
    team: vibeteam
spec:
  # Run every 2 hours
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: product-manager
        spec:
          restartPolicy: OnFailure
          containers:
            - name: analyzer
              image: python:3.12-slim
              command:
                - /bin/sh
                - -c
                - |
                  apt-get update && apt-get install -y --no-install-recommends git curl &&
                  curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg &&
                  echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null &&
                  apt-get update && apt-get install -y gh &&
                  pip install --quiet requests sentry-sdk &&
                  python /scripts/analyze_conversations.py
              env:
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_PUBLIC_KEY
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_SECRET_KEY
                - name: LANGFUSE_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_BASE_URL
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: GITHUB_TOKEN
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          volumes:
            - name: scripts
              configMap:
                name: product-manager-scripts
                defaultMode: 0755
