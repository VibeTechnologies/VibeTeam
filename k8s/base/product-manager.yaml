# Product Manager CronJob
# Analyzes Langfuse conversations for feature requests
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: product-manager
  labels:
    app: product-manager
    team: vibeteam
spec:
  # Run every 2 hours
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: product-manager
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: analyzer
              image: ghcr.io/vibetechnologies/vibeteam:latest
              command: ["vibeteam", "scheduled", "pm-analyze", "--hours", "2"]
              env:
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_PUBLIC_KEY
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_SECRET_KEY
                - name: LANGFUSE_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_BASE_URL
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: GITHUB_TOKEN
                - name: AZURE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: AZURE_API_KEY
                - name: AZURE_API_BASE
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: AZURE_API_BASE
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
