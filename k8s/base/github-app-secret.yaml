# GitHub App Secret for VibeTeam Agents
#
# This is a TEMPLATE file. Actual values should be managed via:
# - Kubernetes Sealed Secrets for production
# - kubectl create secret for local development
#
# Create the secret:
# kubectl create secret generic github-app \
#   --from-literal=app-id=YOUR_APP_ID \
#   --from-literal=installation-id=YOUR_INSTALLATION_ID \
#   --from-file=private-key=path/to/private-key.pem \
#   -n vibeteam
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app
  labels:
    app: vibeteam
    component: github-app
type: Opaque
stringData:
  # GitHub App ID (found in App settings page)
  app-id: "REPLACE_WITH_APP_ID"
  # Installation ID (found in organization's installed apps)
  installation-id: "REPLACE_WITH_INSTALLATION_ID"
  # Private key in PEM format (generate from App settings)
  private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY_CONTENT
    -----END RSA PRIVATE KEY-----
