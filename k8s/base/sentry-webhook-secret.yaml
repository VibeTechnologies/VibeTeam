# Sentry Webhook Secret for VibeTeam
#
# This is a TEMPLATE file. Actual values should be managed via:
# - Kubernetes Sealed Secrets for production
# - kubectl create secret for local development
#
# Create the secret:
# kubectl create secret generic sentry-webhook-secret \
#   --from-literal=client-secret=YOUR_SENTRY_CLIENT_SECRET \
#   -n vibeteam
#
# To get your Sentry client secret:
# 1. Go to Sentry -> Settings -> Developer Settings -> Internal Integrations
# 2. Create or edit your integration
# 3. Copy the "Client Secret" value
---
apiVersion: v1
kind: Secret
metadata:
  name: sentry-webhook-secret
  labels:
    app: vibeteam
    component: sentry-webhook
type: Opaque
stringData:
  # Sentry webhook client secret (for HMAC signature verification)
  client-secret: "REPLACE_WITH_SENTRY_CLIENT_SECRET"
