---
# VibeTeam Gateway - Routes webhooks to agent microservices
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibeteam-gateway
  namespace: vibeteam
  labels:
    app: vibeteam-gateway
    team: vibeteam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vibeteam-gateway
  template:
    metadata:
      labels:
        app: vibeteam-gateway
        team: vibeteam
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: agents-sync
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -f /app/agents/agents.yaml ]; then
                echo "Agents config already present."
                exit 0
              fi
              mkdir -p /app/agents
              if mkdir /app/agents/.init-lock 2>/dev/null; then
                git clone --depth 1 --branch "${AGENTS_REPO_REF}" "${AGENTS_REPO_URL}" /tmp/repo
                cp -R /tmp/repo/agents/. /app/agents/
                rm -rf /tmp/repo
                rmdir /app/agents/.init-lock
              else
                echo "Waiting for agents config to be populated..."
                until [ -f /app/agents/agents.yaml ]; do sleep 2; done
              fi
          env:
            - name: AGENTS_REPO_URL
              value: "https://github.com/VibeTechnologies/VibeTeam.git"
            - name: AGENTS_REPO_REF
              value: "master"
          volumeMounts:
            - name: agents-config
              mountPath: /app/agents
      containers:
        - name: gateway
          image: ghcr.io/vibetechnologies/vibeteam:latest
          command: ["python", "-m", "vibeteam.gateway.server"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: github-app-role-secrets
                optional: true
          env:
            # Agent service URLs (internal k8s DNS)
            - name: AUTOGEN_SERVICE_URL
              value: "http://autogen-svc:8080"
            - name: CREWAI_SERVICE_URL
              value: "http://crewai-svc:8080"
            - name: OPENHANDS_SERVICE_URL
              value: "http://openhands-svc:8080"
            - name: SCHEDULER_SERVICE_URL
              value: "http://scheduler-svc:8080"
            - name: DEFAULT_FRAMEWORK
              value: "openhands"
            - name: VIBETEAM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENTS_DIR
              value: "/app/agents"
            - name: AGENTS_CONFIG_PATH
              value: "/app/agents/agents.yaml"
            # GitHub configuration
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: GITHUB_BOT_USERNAME
              value: "vibeteam-bot[bot]"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-secret
                  key: app-id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app-secret
                  key: private-key
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-secret
                  key: installation-id
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
                  optional: true
            # Slack configuration
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SLACK_SIGNING_SECRET
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SLACK_BOT_TOKEN
                  optional: true
            # Trigger endpoint authentication
            - name: SLACK_TRIGGER_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SLACK_TRIGGER_SECRET
                  optional: true
            # Sentry configuration
            - name: SENTRY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_CLIENT_SECRET
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: LANGFUSE_BASE_URL
                  optional: true
            - name: LANGFUSE_HOST
              value: "$(LANGFUSE_BASE_URL)"
            # Async callback configuration
            - name: GATEWAY_URL
              value: "http://vibeteam-gateway:8080"
            - name: CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: CALLBACK_SECRET
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: agents-config
              mountPath: /app/agents
      volumes:
        - name: agents-config
          persistentVolumeClaim:
            claimName: agents-config
---
apiVersion: v1
kind: Service
metadata:
  name: vibeteam-gateway
  namespace: vibeteam
  labels:
    app: vibeteam-gateway
    team: vibeteam
spec:
  selector:
    app: vibeteam-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
