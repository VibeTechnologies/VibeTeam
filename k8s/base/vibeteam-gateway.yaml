---
# VibeTeam Gateway - Routes webhooks to agent microservices
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibeteam-gateway
  namespace: vibeteam
  labels:
    app: vibeteam-gateway
    team: vibeteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibeteam-gateway
  template:
    metadata:
      labels:
        app: vibeteam-gateway
        team: vibeteam
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gateway
          image: ghcr.io/vibetechnologies/vibeteam:latest
          command: ["python", "-m", "vibeteam.gateway.server"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Agent service URLs (internal k8s DNS)
            - name: AUTOGEN_SERVICE_URL
              value: "http://autogen-svc:8080"
            - name: CREWAI_SERVICE_URL
              value: "http://crewai-svc:8080"
            - name: OPENHANDS_SERVICE_URL
              value: "http://openhands-svc:8080"
            - name: SCHEDULER_SERVICE_URL
              value: "http://scheduler-svc:8080"
            - name: DEFAULT_FRAMEWORK
              value: "openhands"
            # GitHub configuration
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: GITHUB_BOT_USERNAME
              value: "vibeteam-bot[bot]"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-secret
                  key: app-id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app-secret
                  key: private-key
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-secret
                  key: installation-id
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
                  optional: true
            # Slack configuration
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SLACK_SIGNING_SECRET
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SLACK_BOT_TOKEN
                  optional: true
            # Sentry configuration
            - name: SENTRY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: docs-uploads
              mountPath: /app/data/uploads
      volumes:
        - name: docs-uploads
          persistentVolumeClaim:
            claimName: docs-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vibeteam-gateway
  namespace: vibeteam
  labels:
    app: vibeteam-gateway
    team: vibeteam
spec:
  selector:
    app: vibeteam-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
