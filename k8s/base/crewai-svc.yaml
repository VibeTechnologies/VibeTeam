# CrewAI Agent Service Deployment
# Long-running FastAPI server for CrewAI agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-svc
  labels:
    app: crewai-svc
    team: vibeteam
    component: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crewai-svc
  template:
    metadata:
      labels:
        app: crewai-svc
        team: vibeteam
        component: agent-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: crewai
          image: ghcr.io/vibetechnologies/vibeteam-crewai:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_BASE
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_OPENAI_DEPLOYMENT
            - name: AZURE_API_VERSION
              value: "2024-08-01-preview"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_AUTH_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: sessions-volume
              mountPath: /app/.sessions
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: sessions-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crewai-svc
  labels:
    app: crewai-svc
    team: vibeteam
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: crewai-svc
