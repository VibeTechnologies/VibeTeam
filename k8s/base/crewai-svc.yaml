# CrewAI Agent Service Deployment
# Long-running FastAPI server for CrewAI agents
# NOTE: Disabled for now (known broken). Replicas set to 0.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-svc
  labels:
    app: crewai-svc
    team: vibeteam
    component: agent-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: crewai-svc
  template:
    metadata:
      labels:
        app: crewai-svc
        team: vibeteam
        component: agent-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: agents-sync
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -f /app/agents/agents.yaml ]; then
                echo "Agents config already present."
                exit 0
              fi
              mkdir -p /app/agents
              if mkdir /app/agents/.init-lock 2>/dev/null; then
                git clone --depth 1 --branch "${AGENTS_REPO_REF}" "${AGENTS_REPO_URL}" /tmp/repo
                cp -R /tmp/repo/agents/. /app/agents/
                rm -rf /tmp/repo
                rmdir /app/agents/.init-lock
              else
                echo "Waiting for agents config to be populated..."
                until [ -f /app/agents/agents.yaml ]; do sleep 2; done
              fi
          env:
            - name: AGENTS_REPO_URL
              value: "https://github.com/VibeTechnologies/VibeTeam.git"
            - name: AGENTS_REPO_REF
              value: "master"
          volumeMounts:
            - name: agents-config
              mountPath: /app/agents
      containers:
        - name: crewai
          image: ghcr.io/vibetechnologies/vibeteam-crewai:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: github-app-role-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_KEY
            - name: AZURE_API_BASE
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_BASE
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_OPENAI_DEPLOYMENT
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: AZURE_API_VERSION
            - name: AZURE_ALLOW_RESPONSES_MODELS
              value: "true"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_AUTH_TOKEN
            - name: CHROME_DEVTOOLS_BROWSER_URL
              value: "http://browserless:3000"
            - name: AGENTS_DIR
              value: "/app/agents"
            - name: AGENTS_CONFIG_PATH
              value: "/app/agents/agents.yaml"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: sessions-volume
              mountPath: /app/.sessions
            - name: agents-config
              mountPath: /app/agents
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: sessions-volume
          emptyDir: {}
        - name: agents-config
          persistentVolumeClaim:
            claimName: agents-config
---
apiVersion: v1
kind: Service
metadata:
  name: crewai-svc
  labels:
    app: crewai-svc
    team: vibeteam
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: crewai-svc
