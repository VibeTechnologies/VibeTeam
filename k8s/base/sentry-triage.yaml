---
# Sentry Triage CronJob - ConfigMap with Python script
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentry-triage-scripts
data:
  triage_sentry.py: |
    #!/usr/bin/env python3
    """Sentry Issue Triage - Inline version for k8s CronJob"""
    
    import json
    import logging
    import os
    import re
    import subprocess
    import sys
    from dataclasses import dataclass
    from datetime import datetime
    from pathlib import Path
    from typing import Optional
    
    import requests
    
    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [%(levelname)s] %(message)s",
    )
    logger = logging.getLogger(__name__)
    
    SENTRY_API_BASE = "https://sentry.io/api/0"
    SENTRY_ORG = "vibetechnologies"
    PROJECTS = ["vibebrowserextension", "vibe-api-gateway"]
    GITHUB_REPO = "VibeTechnologies/VibeWebAgent"
    
    # Issue classification patterns
    INVALID_PATTERNS = [
        r"Failed to fetch", r"NetworkError", r"net::ERR_", r"ECONNREFUSED",
        r"ResizeObserver loop", r"Script error\.", r"AbortError",
        r"chrome-extension://(?!ajfjlohdpfgngdjfafhhcnpmijbbdgln)",
    ]
    
    VALID_PATTERNS = [
        r"TypeError:", r"ReferenceError:", r"Cannot read propert",
        r"is not a function", r"undefined is not", r"Unhandled Promise",
    ]
    
    @dataclass
    class SentryIssue:
        id: str
        short_id: str
        title: str
        culprit: str
        level: str
        count: int
        user_count: int
        project: str
        permalink: str
        first_seen: str
    
    class SentryTriager:
        def __init__(self):
            self.auth_token = os.environ.get("SENTRY_AUTH_TOKEN")
            self.gh_token = os.environ.get("GITHUB_TOKEN")
            if not self.auth_token:
                raise ValueError("SENTRY_AUTH_TOKEN required")
            self.processed_file = Path("/tmp/sentry-processed.json")
            self.processed_ids = self._load_processed()
        
        def _load_processed(self) -> set:
            if self.processed_file.exists():
                with open(self.processed_file) as f:
                    return set(json.load(f).get("processed_ids", []))
            return set()
        
        def _save_processed(self, issue_id: str):
            self.processed_ids.add(issue_id)
            with open(self.processed_file, "w") as f:
                json.dump({"processed_ids": list(self.processed_ids)}, f)
        
        def _headers(self) -> dict:
            return {"Authorization": f"Bearer {self.auth_token}"}
        
        def fetch_issues(self, hours: int = 12) -> list[SentryIssue]:
            issues = []
            for proj in PROJECTS:
                url = f"{SENTRY_API_BASE}/projects/{SENTRY_ORG}/{proj}/issues/"
                params = {"query": "is:unresolved", "statsPeriod": f"{hours}h", "limit": 25}
                try:
                    resp = requests.get(url, headers=self._headers(), params=params)
                    resp.raise_for_status()
                    for i in resp.json():
                        issues.append(SentryIssue(
                            id=i["id"], short_id=i.get("shortId", ""),
                            title=i.get("title", ""), culprit=i.get("culprit", ""),
                            level=i.get("level", "error"), count=i.get("count", 0),
                            user_count=i.get("userCount", 0), project=proj,
                            permalink=i.get("permalink", ""), first_seen=i.get("firstSeen", ""),
                        ))
                except Exception as e:
                    logger.error(f"Error fetching {proj}: {e}")
            return sorted(issues, key=lambda x: x.count, reverse=True)
        
        def is_valid_bug(self, issue: SentryIssue) -> tuple[bool, str]:
            for p in INVALID_PATTERNS:
                if re.search(p, issue.title, re.I) or re.search(p, issue.culprit, re.I):
                    return False, f"Matches noise pattern: {p}"
            for p in VALID_PATTERNS:
                if re.search(p, issue.title, re.I):
                    return True, f"Matches bug pattern: {p}"
            if issue.count > 50 or issue.user_count > 10:
                return True, f"High impact: {issue.count} events, {issue.user_count} users"
            return False, "Low impact, no bug patterns"
        
        def create_github_issue(self, issue: SentryIssue, reason: str):
            title = f"[{'Extension' if 'extension' in issue.project else 'API'}] {issue.title[:80]}"
            body = f"""## Sentry Issue
    
    **Link:** {issue.permalink}
    **Project:** {issue.project}
    **Occurrences:** {issue.count} | **Users:** {issue.user_count}
    
    ## Error
    ```
    {issue.title}
    ```
    **Culprit:** `{issue.culprit}`
    
    ## Classification
    {reason}
    
    ---
    *Auto-created by Sentry Triage Bot*
    """
            cmd = ["gh", "issue", "create", "--repo", GITHUB_REPO,
                   "--title", title, "--body", body, "--label", "bug,sentry"]
            result = subprocess.run(cmd, capture_output=True, text=True,
                                    env={**os.environ, "GH_TOKEN": self.gh_token})
            if result.returncode == 0:
                logger.info(f"Created: {result.stdout.strip()}")
                self._add_sentry_comment(issue.id, f"GitHub issue: {result.stdout.strip()}")
            else:
                logger.error(f"Failed: {result.stderr}")
        
        def _add_sentry_comment(self, issue_id: str, text: str):
            url = f"{SENTRY_API_BASE}/issues/{issue_id}/comments/"
            requests.post(url, headers=self._headers(), json={"text": text})
        
        def resolve_issue(self, issue_id: str, reason: str):
            self._add_sentry_comment(issue_id, f"Auto-resolved: {reason}")
            url = f"{SENTRY_API_BASE}/issues/{issue_id}/"
            requests.put(url, headers=self._headers(), json={"status": "ignored"})
        
        def run(self, hours: int = 12):
            logger.info(f"Fetching issues from last {hours}h...")
            issues = self.fetch_issues(hours)
            logger.info(f"Found {len(issues)} unresolved issues")
            
            stats = {"valid": 0, "invalid": 0, "skipped": 0}
            for issue in issues:
                if issue.id in self.processed_ids:
                    stats["skipped"] += 1
                    continue
                
                is_valid, reason = self.is_valid_bug(issue)
                logger.info(f"[{issue.short_id}] {issue.title[:50]}... -> {'VALID' if is_valid else 'NOISE'}")
                
                if is_valid:
                    self.create_github_issue(issue, reason)
                    stats["valid"] += 1
                else:
                    self.resolve_issue(issue.id, reason)
                    stats["invalid"] += 1
                
                self._save_processed(issue.id)
            
            logger.info(f"Done: {stats}")
    
    if __name__ == "__main__":
        SentryTriager().run(hours=12)

---
# Sentry Triage CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sentry-triage
  labels:
    app: sentry-triage
    team: vibeteam
spec:
  # Run every 12 hours at 00:00 and 12:00 UTC
  schedule: "0 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600  # 10 min timeout
      template:
        metadata:
          labels:
            app: sentry-triage
        spec:
          restartPolicy: OnFailure
          containers:
            - name: triage
              image: python:3.12-slim
              command:
                - /bin/sh
                - -c
                - |
                  pip install --quiet requests &&
                  python /scripts/triage_sentry.py
              env:
                - name: SENTRY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: SENTRY_AUTH_TOKEN
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: GITHUB_TOKEN
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          volumes:
            - name: scripts
              configMap:
                name: sentry-triage-scripts
                defaultMode: 0755
