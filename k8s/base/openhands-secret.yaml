# OpenHands Secret for VibeTeam
#
# This is a TEMPLATE file. Actual values should be managed via:
# - Kubernetes Sealed Secrets for production
# - kubectl create secret for local development
#
# Create the secret:
# kubectl create secret generic openhands-secret \
#   --from-literal=api-key=YOUR_OPENHANDS_API_KEY \
#   -n vibeteam
#
# Note: The OpenHands API key is used to authenticate requests from the
# webhook server to the OpenHands Agent Server. If running OpenHands
# without authentication, this can be left empty.
---
apiVersion: v1
kind: Secret
metadata:
  name: openhands-secret
  labels:
    app: vibeteam
    component: openhands
type: Opaque
stringData:
  # OpenHands API key for authenticating requests
  api-key: "REPLACE_WITH_OPENHANDS_API_KEY"
