apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-svc
  labels:
    app: openclaw-svc
    team: vibeteam
    component: agent-service
    framework: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-svc
  template:
    metadata:
      labels:
        app: openclaw-svc
        team: vibeteam
        component: agent-service
        framework: openclaw
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: install-kubectl
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              KUBECTL_VERSION="v1.31.4"
              curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
              chmod 0755 kubectl
              mv kubectl /kubectl/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl
      containers:
        - name: openclaw
          image: ghcr.io/vibetechnologies/vibeteam:latest
          imagePullPolicy: Always
          command:
            [
              "python",
              "-m",
              "uvicorn",
              "agent_service.openclaw.server:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8080",
            ]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: github-app-role-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: OPENCLAW_GATEWAY_URL
              value: "http://openclaw-gateway:18789"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secret
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_AUTH_TOKEN
            - name: GMAIL_CREDENTIALS_PATH
              value: "/gmail/gmail-credentials.json"
            - name: GMAIL_TOKEN_PATH
              value: "/gmail/gmail-token.json"
            - name: VIBETEAM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              subPath: kubectl
            - name: gmail-oauth
              mountPath: /gmail
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: kubectl-bin
          emptyDir: {}
        - name: gmail-oauth
          secret:
            secretName: gmail-oauth-secret
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-svc
  labels:
    app: openclaw-svc
    team: vibeteam
    framework: openclaw
spec:
  selector:
    app: openclaw-svc
  ports:
    - port: 8080
      targetPort: 8080
      name: http
