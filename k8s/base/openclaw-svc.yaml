apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-svc
  labels:
    app: openclaw-svc
    team: vibeteam
    component: agent-service
    framework: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-svc
  template:
    metadata:
      labels:
        app: openclaw-svc
        team: vibeteam
        component: agent-service
        framework: openclaw
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: install-kubectl
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              KUBECTL_VERSION="v1.31.4"
              curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
              chmod 0755 kubectl
              mv kubectl /kubectl/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl
        - name: agents-sync
          image: alpine/git:2.45.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              LOCK_DIR="/app/agents/.init-lock"
              WAIT_TIMEOUT="${AGENTS_SYNC_TIMEOUT_SECONDS:-180}"
              SLEEP_SECONDS=2
              ELAPSED=0
              if [ -f /app/agents/agents.yaml ]; then
                echo "Agents config already present."
                exit 0
              fi
              mkdir -p /app/agents
              if mkdir "$LOCK_DIR" 2>/dev/null; then
                cleanup() {
                  rmdir "$LOCK_DIR" 2>/dev/null || true
                }
                trap cleanup EXIT
                git clone --depth 1 --branch "${AGENTS_REPO_REF}" "${AGENTS_REPO_URL}" /tmp/repo
                cp -R /tmp/repo/agents/. /app/agents/
                rm -rf /tmp/repo
              else
                echo "Waiting for agents config to be populated..."
                while [ ! -f /app/agents/agents.yaml ]; do
                  sleep "$SLEEP_SECONDS"
                  ELAPSED=$((ELAPSED + SLEEP_SECONDS))
                  if [ "$ELAPSED" -ge "$WAIT_TIMEOUT" ]; then
                    echo "Timed out waiting for /app/agents/agents.yaml after ${WAIT_TIMEOUT}s"
                    exit 1
                  fi
                done
              fi
          env:
            - name: AGENTS_REPO_URL
              value: "https://github.com/VibeTechnologies/VibeTeam.git"
            - name: AGENTS_REPO_REF
              value: "master"
          volumeMounts:
            - name: agents-config
              mountPath: /app/agents
      containers:
        - name: openclaw
          image: ghcr.io/vibetechnologies/vibeteam:latest
          imagePullPolicy: Always
          command:
            [
              "python",
              "-m",
              "uvicorn",
              "agent_service.openclaw.server:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8080",
            ]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: github-app-role-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: OPENCLAW_GATEWAY_URL
              value: "http://openclaw-gateway:18789"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secret
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: GITHUB_TOKEN
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vibeteam-secrets
                  key: SENTRY_AUTH_TOKEN
            - name: GMAIL_CREDENTIALS_PATH
              value: "/gmail/gmail-credentials.json"
            - name: GMAIL_TOKEN_PATH
              value: "/gmail/gmail-token.json"
            - name: VIBETEAM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENTS_DIR
              value: "/app/agents"
            - name: AGENTS_CONFIG_PATH
              value: "/app/agents/agents.yaml"
            - name: OPENCLAW_DOCS_CONTEXT_ENABLED
              value: "true"
            - name: OPENCLAW_DOCS_CONTEXT_ROLES
              value: "product_manager"
            - name: OPENCLAW_DOCS_CONTEXT_MAX_RESULTS
              value: "3"
            - name: OPENCLAW_DOCS_CONTEXT_MAX_CHARS
              value: "4000"
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin/kubectl
              subPath: kubectl
            - name: gmail-oauth
              mountPath: /gmail
            - name: agents-config
              mountPath: /app/agents
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: kubectl-bin
          emptyDir: {}
        - name: gmail-oauth
          secret:
            secretName: gmail-oauth-secret
        - name: agents-config
          persistentVolumeClaim:
            claimName: agents-config
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-svc
  labels:
    app: openclaw-svc
    team: vibeteam
    framework: openclaw
spec:
  selector:
    app: openclaw-svc
  ports:
    - port: 8080
      targetPort: 8080
      name: http
