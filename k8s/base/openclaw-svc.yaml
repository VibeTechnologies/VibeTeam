apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-svc
  labels:
    app: openclaw-svc
    team: vibeteam
    component: agent-service
    framework: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-svc
  template:
    metadata:
      labels:
        app: openclaw-svc
        team: vibeteam
        component: agent-service
        framework: openclaw
    spec:
      serviceAccountName: vibeteam-agent
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: openclaw
          image: ghcr.io/vibetechnologies/vibeteam:latest
          imagePullPolicy: Always
          command:
            [
              "python",
              "-m",
              "uvicorn",
              "agent_service.openclaw.server:app",
              "--host",
              "0.0.0.0",
              "--port",
              "8080",
            ]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: OPENCLAW_GATEWAY_URL
              value: "http://openclaw-gateway:18789"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secret
                  key: OPENCLAW_GATEWAY_TOKEN
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-svc
  labels:
    app: openclaw-svc
    team: vibeteam
    framework: openclaw
spec:
  selector:
    app: openclaw-svc
  ports:
    - port: 8080
      targetPort: 8080
      name: http
