# Support Engineer CronJob
# Processes support emails from Gmail
---
# Persistent volume claim for Gmail token storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gmail-token-storage
  labels:
    app: support-engineer
    team: vibeteam
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: support-engineer
  labels:
    app: support-engineer
    team: vibeteam
spec:
  # Run every 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: support-engineer
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            fsGroup: 1000
          containers:
            - name: processor
              image: ghcr.io/vibetechnologies/vibeteam:latest
              command: ["vibeteam", "scheduled", "support-emails", "--max-emails", "20"]
              env:
                - name: GMAIL_CREDENTIALS_PATH
                  value: "/secrets/gmail-credentials.json"
                - name: GMAIL_TOKEN_PATH
                  value: "/data/gmail-token.json"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: GITHUB_TOKEN
              volumeMounts:
                - name: gmail-secrets
                  mountPath: /secrets
                  readOnly: true
                - name: token-storage
                  mountPath: /data
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          initContainers:
            # Copy token to writable location if not exists
            - name: init-token
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  if [ ! -f /data/gmail-token.json ] && [ -f /secrets/gmail-token.json ]; then
                    cp /secrets/gmail-token.json /data/gmail-token.json
                    chmod 666 /data/gmail-token.json
                    echo "Copied token to writable location"
                  elif [ -f /data/gmail-token.json ]; then
                    chmod 666 /data/gmail-token.json
                    echo "Token already exists, ensured permissions"
                  else
                    echo "Token not available"
                  fi
              volumeMounts:
                - name: gmail-secrets
                  mountPath: /secrets
                  readOnly: true
                - name: token-storage
                  mountPath: /data
          volumes:
            - name: gmail-secrets
              secret:
                secretName: gmail-oauth-secrets
            - name: token-storage
              persistentVolumeClaim:
                claimName: gmail-token-storage
