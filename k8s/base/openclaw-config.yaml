apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw-gateway
    team: vibeteam
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "controlUi": {
          "allowInsecureAuth": true,
          "dangerouslyAllowHostHeaderOriginFallback": true
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "litellm/gpt-5.2"
          }
        },
        "list": [
          {
            "id": "product-manager",
            "name": "Product Manager",
            "agentDir": "/home/node/.openclaw/agents/product-manager/agent"
          }
        ]
      },
      "models": {
        "mode": "replace",
        "providers": {
          "litellm": {
            "baseUrl": "${LITELLM_BASE_URL}",
            "apiKey": "${LITELLM_API_KEY}",
            "api": "openai-completions",
            "models": [
              {
                "id": "gpt-5.2",
                "name": "GPT-5.2",
                "reasoning": true,
                "input": ["text", "image"],
                "cost": { "input": 3, "output": 12, "cacheRead": 0.75, "cacheWrite": 1.5 },
                "contextWindow": 1047576,
                "maxTokens": 32768
              }
            ]
          }
        }
      }
    }
