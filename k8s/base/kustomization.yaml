# Base kustomization for VibeTeam agents
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Infrastructure
  - postgres.yaml
  # Gateway (routes webhooks to agent microservices)
  - vibeteam-gateway.yaml
  # Agent Microservices (long-running servers with APScheduler)
  - autogen-svc.yaml
  - crewai-svc.yaml
  - scheduler-svc.yaml
  # Multi-framework agent deployments (AutoGen, CrewAI, OpenHands)
  - frameworks/
  # Note: Old CronJobs (product-manager, support-engineer, release-engineer,
  # software-engineer) have been replaced by scheduler-svc tasks
