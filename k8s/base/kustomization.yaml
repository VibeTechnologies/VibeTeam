# Base kustomization for VibeTeam agents
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Infrastructure
  - postgres.yaml
  # Agent Microservices (long-running servers)
  - autogen-svc.yaml
  - crewai-svc.yaml
  # Agent CronJobs (to be replaced by microservices)
  - product-manager.yaml
  - support-engineer.yaml
  - release-engineer.yaml  # Also contains reliability-engineer
  - software-engineer.yaml
  - frameworks/  # Multi-framework agent deployments (AutoGen, CrewAI, OpenHands)
