# Base kustomization for VibeTeam agents
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # RBAC for agent pods (read-only k8s access)
  - agent-rbac.yaml
  # Infrastructure
  - postgres.yaml
  - browserless.yaml
  # Gateway (routes webhooks to agent microservices)
  - vibeteam-gateway.yaml
  # Agent Microservices (FastAPI servers handling all agent roles)
  - openhands-svc.yaml
  - openclaw-svc.yaml
  # OpenClaw gateway (shared, multi-persona)
  - openclaw-config.yaml
  - openclaw-gateway.yaml
  - scheduler-svc.yaml
  # LiteLLM proxy (in-namespace for OpenClaw)
  - litellm.yaml
  # Gmail email processor (daemon polling for support emails)
  - gmail-processor.yaml
  # Production infrastructure
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
  - ingress.yaml
  # Multi-framework agent deployments (AutoGen, CrewAI, OpenHands)
  - frameworks/
  # Note: Slack agents removed - gateway receives webhooks and routes to agent services
  # Old per-role slack-agents/ polling pattern was incorrect per design.md

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: openclaw-agent-prompts
    files:
      - AGENTS.md=openclaw-prompts/ProductManager.AGENTS.md
