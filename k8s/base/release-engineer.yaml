# Release Engineer CronJob
# Checks for pending releases and manages changelog
#
# GitHub Authentication:
# Uses GitHub App credentials for better security and audit trail.
# Falls back to GITHUB_TOKEN (PAT) if App credentials not available.
#
# Kubernetes Access:
# Uses ServiceAccount with read-only cluster access for validation.
---
# ServiceAccount for VibeTeam agents
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vibeteam-agent
  labels:
    team: vibeteam
---
# ClusterRole with read-only access for cluster validation
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vibeteam-agent-reader
  labels:
    team: vibeteam
rules:
  # Core resources - read only
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - namespaces
      - nodes
      - events
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  # Apps resources - read only
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # Batch resources - read only
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # Networking resources - read only
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # Autoscaling resources - read only
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  # Cert-manager resources - read only
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding to grant access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vibeteam-agent-reader
  labels:
    team: vibeteam
subjects:
  - kind: ServiceAccount
    name: vibeteam-agent
    namespace: vibeteam
roleRef:
  kind: ClusterRole
  name: vibeteam-agent-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: release-engineer
  labels:
    app: release-engineer
    team: vibeteam
spec:
  # Run daily at 9 AM UTC
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: release-engineer
        spec:
          serviceAccountName: vibeteam-agent
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: checker
              image: ghcr.io/vibetechnologies/vibeteam:latest
              command: ["vibeteam", "scheduled", "release-check"]
              env:
                # GitHub App authentication (preferred)
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: github-app
                      key: app-id
                      optional: true
                - name: GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: github-app
                      key: installation-id
                      optional: true
                - name: GITHUB_APP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: github-app
                      key: private-key
                      optional: true
                # Fallback: PAT authentication
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: GITHUB_TOKEN
                      optional: true
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
---
# Reliability Engineer CronJob
# Health checks on production endpoints
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reliability-engineer
  labels:
    app: reliability-engineer
    team: vibeteam
spec:
  # Run every 5 minutes
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: reliability-engineer
        spec:
          serviceAccountName: vibeteam-agent
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: health-checker
              image: ghcr.io/vibetechnologies/vibeteam:latest
              command:
                - vibeteam
                - scheduled
                - sre-health
                - -e
                - https://api.vibebrowser.app/
                - -e
                - https://portal.vibebrowser.app
                - -e
                - https://docs.vibebrowser.app
              env:
                - name: SENTRY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: SENTRY_AUTH_TOKEN
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
