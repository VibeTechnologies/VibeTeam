# Release Engineer CronJob
# Checks for pending releases and manages changelog
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: release-engineer
  labels:
    app: release-engineer
    team: vibeteam
spec:
  # Run daily at 9 AM UTC
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: release-engineer
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: checker
              image: ghcr.io/vibetechnologies/vibeteam:latest
              command: ["vibeteam", "scheduled", "release-check"]
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: GITHUB_TOKEN
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
---
# Reliability Engineer CronJob
# Health checks on production endpoints
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reliability-engineer
  labels:
    app: reliability-engineer
    team: vibeteam
spec:
  # Run every 5 minutes
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: reliability-engineer
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: health-checker
              image: ghcr.io/vibetechnologies/vibeteam:latest
              command:
                - vibeteam
                - scheduled
                - sre-health
                - -e
                - https://api.vibebrowser.app/
                - -e
                - https://portal.vibebrowser.app
                - -e
                - https://docs.vibebrowser.app
              env:
                - name: SENTRY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: SENTRY_AUTH_TOKEN
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
