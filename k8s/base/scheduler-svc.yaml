# Scheduler Service Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-svc
  labels:
    app: scheduler-svc
    team: vibeteam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-svc
  template:
    metadata:
      labels:
        app: scheduler-svc
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: scheduler
          image: ghcr.io/vibetechnologies/vibeteam-scheduler:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: AUTOGEN_SERVICE_URL
              value: "http://autogen-svc:8080"
            - name: CREWAI_SERVICE_URL
              value: "http://crewai-svc:8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-svc
  labels:
    app: scheduler-svc
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: scheduler-svc
