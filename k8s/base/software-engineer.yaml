# Software Engineer CronJob
# Analyzes GitHub issues labeled for auto-fix and suggests solutions
#
# GitHub Authentication:
# Uses GitHub App credentials for better security and audit trail.
# Falls back to GITHUB_TOKEN (PAT) if App credentials not available.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: software-engineer
  labels:
    app: software-engineer
    team: vibeteam
spec:
  # Run every 4 hours
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: software-engineer
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: analyzer
              image: ghcr.io/vibetechnologies/vibeteam:latest
              command:
                - vibeteam
                - scheduled
                - swe-issues
                - --label
                - auto-fix
                - --repo
                - VibeTechnologies/VibeWebAgent
              env:
                # GitHub App authentication (preferred)
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: github-app
                      key: app-id
                      optional: true
                - name: GITHUB_APP_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef:
                      name: github-app
                      key: installation-id
                      optional: true
                - name: GITHUB_APP_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: github-app
                      key: private-key
                      optional: true
                # Fallback: PAT authentication
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: GITHUB_TOKEN
                      optional: true
                - name: AZURE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: AZURE_API_KEY
                - name: AZURE_API_BASE
                  value: "https://info-mjnxtt51-eastus2.cognitiveservices.azure.com/"
                - name: AZURE_API_VERSION
                  value: "2024-06-01"
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_PUBLIC_KEY
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vibeteam-secrets
                      key: LANGFUSE_SECRET_KEY
                - name: LANGFUSE_BASE_URL
                  value: "https://langfuse.vibebrowser.app"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
