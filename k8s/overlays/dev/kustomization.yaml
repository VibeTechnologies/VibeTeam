# Dev overlay - uses git-sync sidecar for live code updates
# Code syncs every 30s from GitHub master branch - no pod restart needed
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vibeteam

resources:
  - ../../base

# Strategic merge patches for dev mode
patches:
  - path: openhands-svc-patch.yaml
  - path: gateway-patch.yaml
  # JSON patches for other deployments
  - target:
      kind: Deployment
      name: crewai-agents
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/vibetechnologies/vibeteam-crewai:dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GITHUB_BRANCH
          value: "master"
  - target:
      kind: Deployment
      name: autogen-agents
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/vibetechnologies/vibeteam-autogen:dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GITHUB_BRANCH
          value: "master"

# Note: Avoid commonLabels/commonAnnotations as they affect selectors which are immutable
