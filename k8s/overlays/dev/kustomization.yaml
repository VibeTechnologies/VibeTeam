# Dev overlay - uses git-sync sidecar for live code updates
# Code syncs every 30s from GitHub master branch - no pod restart needed
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vibeteam-openclaw-1

resources:
  - ../../base

# Strategic merge patches for dev mode
patches:
  - path: openhands-svc-patch.yaml
  - path: openclaw-svc-patch.yaml
  - path: gateway-patch.yaml
  - path: agents-config-patch.yaml

# Note: Avoid commonLabels/commonAnnotations as they affect selectors which are immutable
