# Dev overlay - uses images that pull fresh code from GitHub on restart
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Patch deployments to use dev images
patches:
  - target:
      kind: Deployment
      name: crewai-agents
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/vibetechnologies/vibeteam-crewai:dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GITHUB_BRANCH
          value: "master"
  - target:
      kind: Deployment
      name: autogen-agents
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/vibetechnologies/vibeteam-autogen:dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GITHUB_BRANCH
          value: "master"

# Common labels for dev environment
commonLabels:
  environment: dev
