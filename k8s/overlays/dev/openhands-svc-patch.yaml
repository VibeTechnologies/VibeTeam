# Dev patch for openhands-svc with git-sync sidecar
# Continuously syncs code from GitHub - no pod restart needed for code changes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-svc
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65533
      # Init container to do initial clone before main container starts
      initContainers:
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.2.1
          args:
            - --repo=https://github.com/VibeTechnologies/VibeTeam.git
            - --ref=master
            - --root=/git
            - --link=current
            - --one-time
          volumeMounts:
            - name: code
              mountPath: /git
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
      containers:
        # Patch the main container to use synced code
        - name: openhands
          image: ghcr.io/vibetechnologies/vibeteam-openhands:dev
          imagePullPolicy: Always
          workingDir: /code/current
          command: ["python", "-m", "uvicorn", "agent_service.openhands.server:app", "--host", "0.0.0.0", "--port", "8080"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    git config --global user.email "agent@vibebrowser.app" &&
                    git config --global user.name "VibeTeam Agent" &&
                    git config --global credential.https://github.com.helper "" &&
                    git config --global credential.https://github.com.helper "!/usr/bin/gh auth git-credential"
          env:
            - name: PYTHONPATH
              value: "/code/current"
            - name: AGENTS_DIR
              value: "/code/current/agents"
            - name: AGENTS_CONFIG_PATH
              value: "/code/current/agents/agents.yaml"
            - name: OPENHANDS_SYNC_IDLE_TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: code
              mountPath: /code
              readOnly: true
        # Git-sync sidecar for continuous updates
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.1
          args:
            - --repo=https://github.com/VibeTechnologies/VibeTeam.git
            - --ref=master
            - --root=/git
            - --link=current
            - --period=30s
            - --max-failures=-1
          volumeMounts:
            - name: code
              mountPath: /git
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
      volumes:
        - name: code
          emptyDir: {}
