# Dev patch for openclaw-svc to run from git-synced repo code
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-svc
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65533
      initContainers:
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.2.1
          args:
            - --repo=https://github.com/VibeTechnologies/VibeTeam.git
            - --ref=master
            - --root=/git
            - --link=current
            - --one-time
          volumeMounts:
            - name: code
              mountPath: /git
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
      containers:
        - name: openclaw
          image: ghcr.io/vibetechnologies/vibeteam-openhands:dev
          imagePullPolicy: Always
          workingDir: /code/current
          env:
            - name: PYTHONPATH
              value: "/code/current"
            - name: AGENTS_DIR
              value: "/code/current/agents"
            - name: AGENTS_CONFIG_PATH
              value: "/code/current/agents/agents.yaml"
          volumeMounts:
            - name: code
              mountPath: /code
              readOnly: true
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.1
          args:
            - --repo=https://github.com/VibeTechnologies/VibeTeam.git
            - --ref=master
            - --root=/git
            - --link=current
            - --period=30s
            - --max-failures=-1
          volumeMounts:
            - name: code
              mountPath: /git
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
      volumes:
        - name: code
          emptyDir: {}
