# GitHub App Secret for VibeTeam Agents
# This file is generated by CI pipeline from GitHub Secrets
# DO NOT commit actual secrets - this is a template/placeholder
#
# CI generates this secret using:
#   - GITHUB_APP_ID from GitHub Secrets
#   - GITHUB_APP_INSTALLATION_ID from GitHub Secrets  
#   - GITHUB_APP_PRIVATE_KEY (base64 encoded) from GitHub Secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app-secret
  labels:
    app: vibeteam
    component: github-app
type: Opaque
stringData:
  # These values are placeholders - CI overwrites this file
  app-id: "PLACEHOLDER"
  installation-id: "PLACEHOLDER"
  private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    PLACEHOLDER - CI will inject real key
    -----END RSA PRIVATE KEY-----
