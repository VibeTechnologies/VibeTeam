# Secrets placeholder - actual secrets should be created via kubectl or sealed-secrets
# 
# Required secrets:
# - LLM_API_KEY: Azure OpenAI API key
# - LLM_MODEL: Model name (e.g., azure/gpt-5-2)
# - LLM_BASE_URL: Azure OpenAI endpoint
# - GITHUB_TOKEN: GitHub PAT with repo access
# - GITHUB_WEBHOOK_SECRET: Secret for verifying GitHub webhooks
# - SENTRY_AUTH_TOKEN: Sentry API auth token
# - SENTRY_WEBHOOK_SECRET: Secret for verifying Sentry webhooks
# - LANGFUSE_PUBLIC_KEY: Langfuse public key
# - LANGFUSE_SECRET_KEY: Langfuse secret key
#
# To create secrets:
#   kubectl create secret generic vibeteam-secrets \
#     --namespace=openhands-ops \
#     --from-literal=LLM_API_KEY=xxx \
#     --from-literal=LLM_MODEL=azure/gpt-5-2 \
#     --from-literal=LLM_BASE_URL=https://xxx.openai.azure.com \
#     --from-literal=GITHUB_TOKEN=ghp_xxx \
#     --from-literal=SENTRY_AUTH_TOKEN=xxx \
#     --from-literal=LANGFUSE_PUBLIC_KEY=pk-xxx \
#     --from-literal=LANGFUSE_SECRET_KEY=sk-xxx
#
# This file is a placeholder that will be overridden by kustomize secretGenerator
# or manual secret creation.
apiVersion: v1
kind: Secret
metadata:
  name: vibeteam-secrets
type: Opaque
stringData:
  # Placeholder - replace with actual values or use secretGenerator
  LLM_API_KEY: "REPLACE_ME"
  LLM_MODEL: "azure/gpt-5-2"
  LLM_BASE_URL: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
  SENTRY_AUTH_TOKEN: "REPLACE_ME"
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"
  LANGFUSE_SECRET_KEY: "REPLACE_ME"
