[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeteam"
version = "3.0.0"
description = "LiteLLM-based autonomous AI team for SaaS development"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VibeTechnologies", email = "team@vibetech.co"},
]
keywords = ["ai", "litellm", "multi-agent", "autonomous", "saas", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LLM and API
    "litellm>=1.35.0",
    "pydantic>=2.0.0,<3.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "tenacity>=8.2.0",
    "requests>=2.28.0",
    # Gmail integration
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    # Observability
    "sentry-sdk>=1.0.0",
    # Core agent framework (AutoGen - Python 3.10+ compatible)
    "pyautogen>=0.4.0",
    # MCP support
    "mcp>=1.0.0",
    # Documentation search
    "rank-bm25>=0.2.2",
    # Gateway server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
# OpenHands requires Python 3.12+
openhands = [
    "openhands-ai>=0.40.0; python_version >= '3.12'",
]
# CrewAI
crewai = [
    "crewai>=0.100.0",
]
# All agent frameworks
agents = [
    "openhands-ai>=0.40.0; python_version >= '3.12'",
    "crewai>=0.100.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
vibeteam = "vibeteam.cli:main"

[project.urls]
Homepage = "https://github.com/VibeTechnologies/VibeTeam"
Repository = "https://github.com/VibeTechnologies/VibeTeam.git"
"Bug Tracker" = "https://github.com/VibeTechnologies/VibeTeam/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibeteam*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["readiness/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "E402", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-v"]
markers = [
    "e2e: end-to-end tests",
    "integration: integration tests",
    "unit: unit tests",
]
