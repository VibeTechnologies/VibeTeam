# Slack App Manifest for VibeTeam
# Import this at https://api.slack.com/apps/A0AAZGWEAVA/app-manifest
# or use `slack manifest update --app-id A0AAZGWEAVA --manifest manifest.yaml`

display_information:
  name: VibeTeam
  description: AI-powered team assistant for VibeTechnologies
  background_color: "#4A154B"

features:
  bot_user:
    display_name: VibeTeam
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - assistant:write
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    # IMPORTANT: Use webhook.team subdomain - team.vibebrowser.app routes to OpenHands
    request_url: https://webhook.team.vibebrowser.app/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://webhook.team.vibebrowser.app/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
