# OpenHands Issue Resolver GitHub Action
# Copy this file to .github/workflows/openhands-resolver.yml in your repository
# This workflow automatically resolves GitHub issues using OpenHands AI agent
#
# Required secrets:
#   - LLM_API_KEY: API key for your LLM provider
#   - LLM_BASE_URL: Base URL for your LLM provider (optional for OpenAI)
#   - LLM_MODEL: Model name (e.g., azure/gpt-4.1, gpt-4-turbo)
#   - PAT_TOKEN: GitHub Personal Access Token with repo permissions

name: OpenHands Issue Resolver

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    # Only run on issues with 'openhands' label or comments containing '@openhands'
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'openhands')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@openhands')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@openhands'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenHands
        run: |
          pip install openhands-ai
          pip install litellm

      - name: Determine task context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "issues" ]; then
            echo "task_type=issue" >> $GITHUB_OUTPUT
            echo "task_id=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "task_title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "task_type=issue_comment" >> $GITHUB_OUTPUT
            echo "task_id=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "task_title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          else
            echo "task_type=pr_comment" >> $GITHUB_OUTPUT
            echo "task_id=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "task_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          fi

      - name: Get issue/PR details
        id: details
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const taskType = '${{ steps.context.outputs.task_type }}';
            const taskId = parseInt('${{ steps.context.outputs.task_id }}');
            
            let body = '';
            let comments = [];
            
            if (taskType === 'issue' || taskType === 'issue_comment') {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: taskId
              });
              body = issue.data.body || '';
              
              const commentsResp = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: taskId
              });
              comments = commentsResp.data.map(c => `@${c.user.login}: ${c.body}`);
            } else {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: taskId
              });
              body = pr.data.body || '';
            }
            
            const fullContext = [body, ...comments].join('\n\n---\n\n');
            core.setOutput('full_context', fullContext.substring(0, 10000));

      - name: Run OpenHands resolver
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cat > /tmp/task.md << 'TASK_EOF'
          # Task: ${{ steps.context.outputs.task_title }}
          
          ## Context
          ${{ steps.details.outputs.full_context }}
          
          ## Instructions
          1. Analyze the issue/request above
          2. Make the necessary code changes to resolve it
          3. Ensure all tests pass
          4. Create clear, atomic commits
          TASK_EOF
          
          # Run OpenHands in headless mode
          python -c "
          import os
          import asyncio
          from openhands.core.main import create_runtime
          from openhands.core.config import AppConfig
          from openhands.events.action import MessageAction
          
          async def run_resolver():
              config = AppConfig(
                  llm_config={
                      'model': os.environ.get('LLM_MODEL', 'gpt-4-turbo'),
                      'api_key': os.environ.get('LLM_API_KEY'),
                      'base_url': os.environ.get('LLM_BASE_URL'),
                  },
                  workspace_base='${{ github.workspace }}',
                  workspace_mount_path='${{ github.workspace }}',
              )
              
              with open('/tmp/task.md', 'r') as f:
                  task = f.read()
              
              runtime = create_runtime(config)
              await runtime.run_action(MessageAction(content=task))
              
              # Wait for completion
              max_iterations = 50
              for i in range(max_iterations):
                  state = await runtime.get_state()
                  if state.is_complete:
                      break
                  await asyncio.sleep(5)
              
              await runtime.close()
          
          asyncio.run(run_resolver())
          "

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "fix: resolve issue #${{ steps.context.outputs.task_id }}"
          title: "[OpenHands] Fix: ${{ steps.context.outputs.task_title }}"
          body: |
            ## Automated PR by OpenHands
            
            This PR was automatically generated to resolve issue #${{ steps.context.outputs.task_id }}.
            
            ### Changes
            Please review the changes below and verify they correctly address the issue.
            
            ---
            
            Closes #${{ steps.context.outputs.task_id }}
          branch: openhands/fix-issue-${{ steps.context.outputs.task_id }}
          base: main
          labels: |
            openhands
            automated

      - name: Comment on issue
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.context.outputs.task_id }}'),
              body: 'OpenHands has created a PR to address this issue. Please review the changes.'
            });

      - name: Comment if no changes
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.context.outputs.task_id }}'),
              body: 'OpenHands analyzed the issue but could not determine the necessary code changes. A human review may be required.'
            });
