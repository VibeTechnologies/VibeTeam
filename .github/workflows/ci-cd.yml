name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vibetechnologies/vibeteam
  K8S_NAMESPACE: vibeteam

jobs:
  # ============================================
  # STAGE 1: Lint & Test
  # ============================================
  
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run ruff lint
        run: uv run ruff check .
      - name: Run ruff format check
        run: uv run ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest tests/unit/ -v --tb=short
        continue-on-error: true  # TODO: remove once tests are stable

  # ============================================
  # STAGE 2: Build Docker Image
  # ============================================
  
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # STAGE 3: Deploy to Production (master only)
  # ============================================
  
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K3S_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      
      - name: Generate secrets file from env
        working-directory: k8s/overlays/prod
        run: |
          cat > .env.secrets << 'EOF'
          # LLM Configuration
          AZURE_API_KEY=${{ secrets.AZURE_API_KEY }}
          AZURE_API_BASE=${{ secrets.AZURE_API_BASE }}
          LITELLM_MASTER_KEY=${{ secrets.LITELLM_MASTER_KEY }}
          
          # GitHub Integration
          GITHUB_TOKEN=${{ secrets.GH_PAT }}
          GITHUB_WEBHOOK_SECRET=${{ secrets.GITHUB_WEBHOOK_SECRET }}
          
          # Slack Integration
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}
          
          # Sentry Integration
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_CLIENT_SECRET=${{ secrets.SENTRY_CLIENT_SECRET }}
          
          # Langfuse Observability
          LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
          
          # Database
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF
      
      - name: Generate GitHub App secret YAML
        working-directory: k8s/overlays/prod
        run: |
          # Decode private key
          echo "${{ secrets.GITHUB_APP_PRIVATE_KEY }}" | base64 -d > github-app-private-key.pem
          
          # Generate the secret YAML with actual values
          cat > github-app-secret.yaml << EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: github-app-secret
            labels:
              app: vibeteam
              component: github-app
          type: Opaque
          stringData:
            app-id: "${{ secrets.GITHUB_APP_ID }}"
            installation-id: "${{ secrets.GITHUB_APP_INSTALLATION_ID }}"
            private-key: |
          $(cat github-app-private-key.pem | sed 's/^/      /')
          EOF
      
      - name: Deploy with kustomize
        run: |
          # Update image tag to current SHA
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/vibetechnologies/vibeteam=ghcr.io/vibetechnologies/vibeteam:${{ github.sha }}
          
          # Apply manifests
          kubectl apply -k .
          
          # Rollout deployments
          echo "Rolling out vibeteam-gateway..."
          kubectl -n $K8S_NAMESPACE rollout restart deployment/vibeteam-gateway
          kubectl -n $K8S_NAMESPACE rollout status deployment/vibeteam-gateway --timeout=120s
          
          echo "Rolling out autogen-svc..."
          kubectl -n $K8S_NAMESPACE rollout restart deployment/autogen-svc || true
          kubectl -n $K8S_NAMESPACE rollout status deployment/autogen-svc --timeout=120s || true
      
      - name: Verify deployment
        run: |
          echo "Pods in $K8S_NAMESPACE namespace:"
          kubectl -n $K8S_NAMESPACE get pods
          
          echo ""
          echo "Services:"
          kubectl -n $K8S_NAMESPACE get svc
          
          echo ""
          echo "Waiting for gateway to be ready..."
          sleep 10
          kubectl -n $K8S_NAMESPACE get pods -l app=vibeteam-gateway
      
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f k8s/overlays/prod/.env.secrets
          rm -f k8s/overlays/prod/github-app-secret.yaml
          rm -f k8s/overlays/prod/github-app-private-key.pem

  # ============================================
  # Summary
  # ============================================
  
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, deploy]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## VibeTeam CI/CD Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && 'Pass' || needs.lint.result == 'skipped' && 'Skip' || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result == 'success' && 'Pass' || needs.test.result == 'skipped' && 'Skip' || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && 'Pass' || needs.build.result == 'skipped' && 'Skip' || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result == 'success' && 'Pass' || needs.deploy.result == 'skipped' && 'Skip' || 'Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }} | **Branch:** ${{ github.ref_name }} | **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
