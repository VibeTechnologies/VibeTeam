name: Deploy to k3s

on:
  push:
    branches: [master, main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  NAMESPACE: vibeteam

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          
      - name: Verify cluster access
        run: kubectl cluster-info
        
      - name: Create namespace
        run: kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
        
      - name: Create secrets
        run: |
          # Create/update vibeteam-secrets
          kubectl -n $NAMESPACE delete secret vibeteam-secrets --ignore-not-found
          kubectl -n $NAMESPACE create secret generic vibeteam-secrets \
            --from-literal=SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --from-literal=GITHUB_TOKEN="${{ secrets.PAT_TOKEN }}"
            
      - name: Deploy CronJobs
        run: |
          # Apply base manifests with namespace override
          kubectl apply -f k8s/base/sentry-triage.yaml -n $NAMESPACE
          kubectl apply -f k8s/base/email-processor.yaml -n $NAMESPACE
          
      - name: Verify deployment
        run: |
          echo "=== CronJobs ==="
          kubectl get cronjobs -n $NAMESPACE
          echo ""
          echo "=== Secrets ==="
          kubectl get secrets -n $NAMESPACE | grep -E "(gmail|vibeteam)" || echo "No matching secrets"
          echo ""
          echo "=== Recent Jobs ==="
          kubectl get jobs -n $NAMESPACE --sort-by=.metadata.creationTimestamp | tail -5 || echo "No jobs yet"
