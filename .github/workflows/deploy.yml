name: Build and Deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'vibeteam/**'
      - 'agents/**'
      - 'k8s/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: vibeteam

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: vibeteam
            dockerfile: Dockerfile
            context: .
          - name: vibeteam-autogen
            dockerfile: agents/autogen/Dockerfile
            context: .
          - name: vibeteam-crewai
            dockerfile: agents/crewai/Dockerfile
            context: .
          - name: vibeteam-openhands
            dockerfile: agents/openhands/Dockerfile
            context: .
          - name: vibeteam-scheduler
            dockerfile: agents/scheduler/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Set image name lowercase
        run: |
          REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${REPO_OWNER}/${{ matrix.name }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name lowercase
        run: |
          REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "REPO_OWNER=${REPO_OWNER}" >> $GITHUB_ENV

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Create namespace
        run: kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl -n $NAMESPACE delete secret ghcr-pull-secret --ignore-not-found
          kubectl -n $NAMESPACE create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.PAT_TOKEN }}

          kubectl -n $NAMESPACE delete secret vibeteam-secrets --ignore-not-found
          kubectl -n $NAMESPACE create secret generic vibeteam-secrets \
            --from-literal=SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --from-literal=GITHUB_TOKEN="${{ secrets.PAT_TOKEN }}" \
            --from-literal=LANGFUSE_PUBLIC_KEY="${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            --from-literal=LANGFUSE_SECRET_KEY="${{ secrets.LANGFUSE_SECRET_KEY }}" \
            --from-literal=LANGFUSE_BASE_URL="https://langfuse.vibebrowser.app" \
            --from-literal=AZURE_API_KEY="${{ secrets.AZURE_API_KEY }}" \
            --from-literal=AZURE_API_BASE="${{ secrets.AZURE_API_BASE }}" \
            --from-literal=AZURE_OPENAI_DEPLOYMENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
            --from-literal=AZURE_API_VERSION="${{ secrets.AZURE_API_VERSION }}" \
            --from-literal=SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}" \
            --from-literal=SLACK_SIGNING_SECRET="${{ secrets.SLACK_SIGNING_SECRET }}" \
            --from-literal=SLACK_TRIGGER_SECRET="${{ secrets.SLACK_TRIGGER_SECRET }}"

          if [ -n "${{ secrets.GMAIL_CREDENTIALS_JSON }}" ]; then
            kubectl -n $NAMESPACE delete secret gmail-oauth-secrets --ignore-not-found
            echo '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > /tmp/gmail-credentials.json
            echo '${{ secrets.GMAIL_TOKEN_JSON }}' > /tmp/gmail-token.json
            kubectl -n $NAMESPACE create secret generic gmail-oauth-secrets \
              --from-file=gmail-credentials.json=/tmp/gmail-credentials.json \
              --from-file=gmail-token.json=/tmp/gmail-token.json
            rm -f /tmp/gmail-credentials.json /tmp/gmail-token.json
          fi

      - name: Update image tags in manifests
        run: |
          SHA_TAG="${{ github.sha }}"
          SHORT_SHA="${SHA_TAG:0:7}"
          sed -i "s|ghcr.io/vibetechnologies/vibeteam:latest|${{ env.REGISTRY }}/${REPO_OWNER}/vibeteam:${SHORT_SHA}|g" k8s/base/*.yaml
          sed -i "s|ghcr.io/vibetechnologies/vibeteam-autogen:latest|${{ env.REGISTRY }}/${REPO_OWNER}/vibeteam-autogen:${SHORT_SHA}|g" k8s/base/*.yaml
          sed -i "s|ghcr.io/vibetechnologies/vibeteam-crewai:latest|${{ env.REGISTRY }}/${REPO_OWNER}/vibeteam-crewai:${SHORT_SHA}|g" k8s/base/*.yaml
          sed -i "s|ghcr.io/vibetechnologies/vibeteam-openhands:latest|${{ env.REGISTRY }}/${REPO_OWNER}/vibeteam-openhands:${SHORT_SHA}|g" k8s/base/*.yaml
          sed -i "s|ghcr.io/vibetechnologies/vibeteam-scheduler:latest|${{ env.REGISTRY }}/${REPO_OWNER}/vibeteam-scheduler:${SHORT_SHA}|g" k8s/base/*.yaml

      - name: Deploy all resources
        run: kubectl apply -k k8s/base/ -n $NAMESPACE

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/autogen-svc -n $NAMESPACE --timeout=120s || true
          kubectl rollout status deployment/crewai-svc -n $NAMESPACE --timeout=120s || true
          kubectl rollout status deployment/openhands-svc -n $NAMESPACE --timeout=120s || true
          kubectl rollout status deployment/scheduler-svc -n $NAMESPACE --timeout=120s || true

      - name: Verify deployment
        run: |
          kubectl get deployments,services,pods -n $NAMESPACE
