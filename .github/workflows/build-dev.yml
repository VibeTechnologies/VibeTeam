name: Build Dev Images

on:
  push:
    branches: [master, main]
    paths:
      - 'agents/**'
      - 'agent_service/**'
      - 'vibeteam/**'
      - 'Dockerfile*'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework to build (crewai, openhands, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - crewai
          - openhands
          - autogen

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-dev-crewai:
    name: Build CrewAI Dev Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.framework == 'all' || inputs.framework == 'crewai'))
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push CrewAI dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent_service/crewai/Dockerfile.dev
          push: true
          tags: |
            ${{ env.REGISTRY }}/vibetechnologies/vibeteam-crewai:dev
          cache-from: type=gha,scope=crewai-dev
          cache-to: type=gha,mode=max,scope=crewai-dev

  build-dev-openhands:
    name: Build OpenHands Dev Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.framework == 'all' || inputs.framework == 'openhands'))
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push OpenHands dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent_service/openhands/Dockerfile.dev
          push: true
          tags: |
            ${{ env.REGISTRY }}/vibetechnologies/vibeteam-openhands:dev
          cache-from: type=gha,scope=openhands-dev
          cache-to: type=gha,mode=max,scope=openhands-dev

  build-dev-autogen:
    name: Build AutoGen Dev Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.framework == 'all' || inputs.framework == 'autogen'))
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push AutoGen dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent_service/autogen/Dockerfile.dev
          push: true
          tags: |
            ${{ env.REGISTRY }}/vibetechnologies/vibeteam-autogen:dev
          cache-from: type=gha,scope=autogen-dev
          cache-to: type=gha,mode=max,scope=autogen-dev
