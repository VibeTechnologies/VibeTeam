name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install ruff black mypy
          
      - name: Run ruff
        run: ruff check .
        
      - name: Run black
        run: black --check .
        
      - name: Run mypy
        run: mypy vibeteam --ignore-missing-imports --disable-error-code=import-untyped

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install -e .[dev]
          
      - name: Run tests
        run: pytest tests/test_agents.py tests/test_tools.py tests/test_orchestrator.py -v
