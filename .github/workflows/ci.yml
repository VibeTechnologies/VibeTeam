name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install ruff mypy
          
      - name: Run ruff lint
        run: ruff check .
        continue-on-error: true  # Existing lint violations across legacy files
        
      - name: Run ruff format
        run: ruff format --check .
        continue-on-error: true  # Formatting drift in legacy files
        
      - name: Run mypy
        run: mypy vibeteam --ignore-missing-imports --disable-error-code=import-untyped
        continue-on-error: true  # mypy has many issues, make non-blocking for now

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install -e .[dev]
          
      - name: Run tests
        run: |
          pytest \
            tests/test_extract_response.py \
            tests/test_response_extraction.py \
            tests/test_message_splitting.py \
            tests/test_role_resolver.py \
            tests/test_task_routing.py \
            -v
